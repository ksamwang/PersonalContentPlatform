services:
  postgres:
    image: ${DOCKER_REGISTRY:-docker.io}/pgvector/pgvector:0.7.4-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/ksamwang/personal-content-platform-backend:${APP_VERSION}
    entrypoint: ["/app/migrate", "up"]
    env_file: ${PCP_ENV_FILE}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/ksamwang/personal-content-platform-backend:${APP_VERSION}
    env_file: ${PCP_ENV_FILE}
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PUBLIC_WEB_ORIGIN: http://public-web:3000
      OBJECT_STORAGE_BASE_PATH: /data/assets
    volumes:
      - asset-data:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ghcr.io/ksamwang/personal-content-platform-backend:${APP_VERSION}
    entrypoint: ["/app/worker"]
    env_file: ${PCP_ENV_FILE}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PUBLIC_WEB_ORIGIN: http://public-web:3000
      OBJECT_STORAGE_BASE_PATH: /data/assets
    volumes:
      - asset-data:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  public-web:
    image: ghcr.io/ksamwang/personal-content-platform-public:${APP_VERSION}
    environment:
      PORT: 3000
      API_ORIGIN: http://api:8080
      WORKSPACE_SLUG: ${WORKSPACE_SLUG}
      PUBLIC_SITE_ORIGIN: https://loshin.org
      PUBLIC_REVALIDATE_TOKEN: ${PUBLIC_REVALIDATE_TOKEN}
    ports:
      - "127.0.0.1:${PUBLIC_WEB_PORT:-23000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  studio-web:
    image: ghcr.io/ksamwang/personal-content-platform-studio:${APP_VERSION}
    environment:
      PORT: 3001
      API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:${STUDIO_WEB_PORT:-23001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  asset-data:
