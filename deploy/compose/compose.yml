services:
  postgres:
    image: ${DOCKER_REGISTRY}/pgvector/pgvector:0.7.4-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        GOPROXY: ${GOPROXY}
    entrypoint: ["/app/migrate", "up"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        GOPROXY: ${GOPROXY}
    env_file: ../../.env
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PUBLIC_WEB_ORIGIN: http://public-web:3000
      OBJECT_STORAGE_BASE_PATH: /data/assets
    volumes:
      - asset-data:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        GOPROXY: ${GOPROXY}
    entrypoint: ["/app/worker"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PUBLIC_WEB_ORIGIN: http://public-web:3000
      OBJECT_STORAGE_BASE_PATH: /data/assets
    volumes:
      - asset-data:/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  public-web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        NPM_REGISTRY: ${NPM_REGISTRY}
        WEB_APP: public-web
        API_ORIGIN: http://api:8080
    environment:
      PORT: 3000
      API_ORIGIN: http://api:8080
      WORKSPACE_SLUG: ${WORKSPACE_SLUG}
      PUBLIC_SITE_ORIGIN: https://loshin.org
      PUBLIC_REVALIDATE_TOKEN: ${PUBLIC_REVALIDATE_TOKEN}
    ports:
      - "127.0.0.1:23000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  studio-web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        NPM_REGISTRY: ${NPM_REGISTRY}
        WEB_APP: studio-web
        API_ORIGIN: http://api:8080
    environment:
      PORT: 3001
      API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:23001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  asset-data:
